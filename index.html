<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say Hay Thách - Nhậu True or Dare</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .neon-glow { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), 0 0 40px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 select-none">

    <!-- HEADER -->
    <header class="flex justify-between items-center py-3 px-4 bg-slate-950/60 backdrop-blur-md border-b border-slate-800 rounded-2xl gap-2 relative">
        <h1 class="text-xl font-extrabold bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">
            🍻 Say Hay Thách
        </h1>
        <div class="flex gap-2">
            <button onclick="openLibraryModal()" class="bg-slate-800/80 hover:bg-slate-700 text-purple-300 border border-purple-500/30 text-xs px-3 py-1.5 rounded-full font-semibold transition">
                📜 Kho dữ liệu
            </button>
            <button onclick="openModal()" class="bg-slate-800/80 hover:bg-slate-700 text-pink-300 border border-pink-500/30 text-xs px-3 py-1.5 rounded-full font-semibold transition">
                + Thêm mới
            </button>
        </div>

        <!-- HEADER TOAST NOTIFICATION -->
        <div id="header-toast" class="absolute top-16 left-1/2 -translate-x-1/2 bg-slate-800/95 border border-purple-500/40 text-slate-200 px-4 py-2 rounded-xl shadow-2xl text-xs font-semibold backdrop-blur-md hidden items-center gap-2 z-50 transition-all duration-300">
            <span id="toast-icon">✨</span>
            <span id="toast-message">Thông báo hệ thống</span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full my-4">

        <!-- SCREEN 1: SETUP PLAYERS & LEVEL -->
        <div id="setup-screen" class="w-full bg-slate-950/80 backdrop-blur-md border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-center text-pink-400">Thiết lập bàn nhậu</h2>
            
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold">Tên người chơi (cách nhau bằng dấu phẩy):</label>
                    <span id="player-count-badge" class="text-xs font-bold text-pink-400 bg-pink-500/10 border border-pink-500/30 px-2 py-0.5 rounded-full">0 người</span>
                </div>
                <textarea id="player-input" rows="3" oninput="updatePlayerCount()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-pink-500 transition text-slate-100" placeholder="An, Bình, Cường, Dung..."></textarea>
            </div>

            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Chọn cấp độ:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectLevel('easy')" id="btn-easy" class="level-btn border border-slate-700 bg-slate-900 py-2 rounded-xl text-xs font-semibold hover:border-pink-500 transition text-slate-300">🌱 Nhẹ nhàng</button>
                    <button onclick="selectLevel('medium')" id="btn-medium" class="level-btn border border-pink-500 bg-pink-500/10 text-pink-400 py-2 rounded-xl text-xs font-semibold transition">🔥 Bàn nhậu</button>
                    <button onclick="selectLevel('hard')" id="btn-hard" class="level-btn border border-slate-700 bg-slate-900 py-2 rounded-xl text-xs font-semibold hover:border-pink-500 transition text-slate-300">🌶️ Hardcore</button>
                </div>
            </div>

            <button onclick="startGame()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 hover:opacity-90 font-bold py-3 rounded-xl shadow-lg neon-glow transition text-sm text-white">
                BẮT ĐẦU NHẬU 🍻
            </button>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="game-screen" class="w-full hidden flex-col items-center">
            <div class="w-full bg-slate-950/80 backdrop-blur-md border border-slate-800 p-6 rounded-2xl text-center shadow-xl relative overflow-hidden mb-6">
                <div class="absolute top-2 right-3 text-xs text-slate-400 uppercase tracking-widest font-bold" id="current-level-badge">Bàn nhậu</div>
                <span class="text-xs text-pink-400 uppercase tracking-widest font-bold">Lượt của</span>
                <h2 id="current-player-name" class="text-3xl font-extrabold text-white my-2">Tên Người Chơi</h2>
                <p id="turn-subtitle" class="text-xs text-slate-400">Chọn Thật hay Thách để nhận thử thách!</p>
            </div>

            <div id="question-card" class="w-full bg-slate-950/80 backdrop-blur-md border border-slate-800 p-6 rounded-2xl mb-6 hidden text-center min-h-[140px] flex flex-col justify-center items-center relative">
                <span id="q-type-tag" class="text-xs uppercase font-extrabold px-3 py-1 rounded-full mb-3">THẬT</span>
                <p id="q-content" class="text-base font-medium text-slate-200 mb-4">Nội dung câu hỏi sẽ hiển thị ở đây...</p>
                <div class="flex gap-2 w-full justify-center">
                    <button onclick="rerollQuestion()" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                        🔄 Đổi câu khác
                    </button>
                    <button onclick="triggerPenalty()" class="bg-red-500/10 hover:bg-red-500/20 text-red-300 border border-red-500/30 text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                        ❌ Bỏ cuộc (Phạt uống!)
                    </button>
                </div>
            </div>

            <div id="choice-buttons" class="grid grid-cols-2 gap-4 w-full mb-4">
                <button onclick="pickQuestion('truth')" class="bg-blue-600/10 border border-blue-500/40 hover:bg-blue-600/20 font-bold py-4 rounded-xl text-blue-300 text-base shadow-md transition flex flex-col items-center gap-1">
                    <span>💡 THẬT (TRUTH)</span>
                </button>
                <button onclick="pickQuestion('dare')" class="bg-red-600/10 border border-red-500/40 hover:bg-red-600/20 font-bold py-4 rounded-xl text-red-300 text-base shadow-md transition flex flex-col items-center gap-1">
                    <span>🔥 THÁCH (DARE)</span>
                </button>
            </div>

            <button id="next-turn-btn" onclick="nextTurn()" class="w-full bg-slate-800 hover:bg-slate-700 font-bold py-3 rounded-xl border border-slate-700 hidden text-sm transition text-slate-200">
                Lượt tiếp theo ➔
            </button>
            
            <button onclick="resetGame()" class="mt-4 text-xs text-slate-400 hover:text-slate-200 underline">Cài đặt lại từ đầu</button>
        </div>

    </main>

    <!-- MODAL: ADD / EDIT QUESTION OR PENALTY -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-pink-400 text-base" id="modal-title">Thêm mới</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100 font-bold text-lg">&times;</button>
            </div>

            <div class="flex gap-2 mb-4" id="cat-mode-tabs">
                <button onclick="switchCategoryMode('question')" id="tab-cat-q" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-pink-500/20 border border-pink-500 text-pink-300">🎯 Câu hỏi</button>
                <button onclick="switchCategoryMode('penalty')" id="tab-cat-p" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-950 border border-slate-800 text-slate-400">🥃 Hình phạt</button>
            </div>

            <!-- QUESTION FORM -->
            <div id="form-question-section" class="space-y-4">
                <input type="hidden" id="edit-id" value="">
                
                <div class="flex gap-2 mb-2" id="add-mode-tabs">
                    <button onclick="switchAddMode('single')" id="tab-add-single" class="flex-1 py-1 rounded-lg text-xs font-semibold bg-pink-500/20 border border-pink-500 text-pink-300">Thêm từng câu</button>
                    <button onclick="switchAddMode('bulk')" id="tab-add-bulk" class="flex-1 py-1 rounded-lg text-xs font-semibold bg-slate-950 border border-slate-800 text-slate-400">📥 Nhập hàng loạt</button>
                </div>

                <div id="form-single" class="space-y-3">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Loại:</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="setModalType('truth')" id="modal-type-truth" class="modal-type-btn border border-blue-500 bg-blue-500/20 text-blue-300 py-2 rounded-xl text-xs font-semibold">Thật (Truth)</button>
                            <button type="button" onclick="setModalType('dare')" id="modal-type-dare" class="modal-type-btn border border-slate-700 bg-slate-950 text-slate-400 py-2 rounded-xl text-xs font-semibold">Thách (Dare)</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Cấp độ:</label>
                        <select id="modal-level" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-100">
                            <option value="easy">Nhẹ nhàng</option>
                            <option value="medium" selected>Bàn nhậu</option>
                            <option value="hard">Hardcore</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Nội dung câu hỏi / thử thách:</label>
                        <textarea id="modal-content" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" placeholder="Nhập câu hỏi..."></textarea>
                    </div>
                    <button onclick="saveQuestion()" id="save-q-btn" class="w-full bg-pink-600 hover:bg-pink-500 font-bold py-3 rounded-xl text-sm text-white transition">Lưu câu hỏi</button>
                </div>

                <div id="form-bulk" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Loại:</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="setBulkType('truth')" id="bulk-type-truth" class="bulk-type-btn border border-blue-500 bg-blue-500/20 text-blue-300 py-2 rounded-xl text-xs font-semibold">Thật (Truth)</button>
                            <button type="button" onclick="setBulkType('dare')" id="bulk-type-dare" class="bulk-type-btn border border-slate-700 bg-slate-950 text-slate-400 py-2 rounded-xl text-xs font-semibold">Thách (Dare)</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Cấp độ:</label>
                        <select id="bulk-level" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-100">
                            <option value="easy">Nhẹ nhàng</option>
                            <option value="medium" selected>Bàn nhậu</option>
                            <option value="hard">Hardcore</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Danh sách câu hỏi (Mỗi dòng 1 câu):</label>
                        <textarea id="bulk-content" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" placeholder="Câu 1\nCâu 2..."></textarea>
                    </div>
                    <button onclick="saveBulkQuestions()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 font-bold py-3 rounded-xl text-sm text-white transition shadow-lg">📥 Nhập tất cả</button>
                </div>
            </div>

            <!-- PENALTY FORM -->
            <div id="form-penalty-section" class="space-y-4 hidden">
                <input type="hidden" id="edit-penalty-id" value="">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Nội dung hình phạt:</label>
                    <textarea id="penalty-modal-content" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" placeholder="Ví dụ: Uống 100%..."></textarea>
                </div>
                <button onclick="savePenalty()" id="save-p-btn" class="w-full bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl text-sm text-white transition">Lưu hình phạt</button>
            </div>
        </div>
    </div>

    <!-- MODAL: LIBRARY -->
    <div id="library-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg p-6 rounded-2xl shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-purple-400 text-base">📜 Kho dữ liệu hệ thống (LocalStorage Saved)</h3>
                <button onclick="closeLibraryModal()" class="text-slate-400 hover:text-slate-100 font-bold text-lg">&times;</button>
            </div>
            
            <div class="flex gap-2 mb-4">
                <button onclick="switchMainLibTab('questions')" id="main-lib-tab-q" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-purple-500/20 border border-purple-500 text-purple-300">🎯 Kho câu hỏi</button>
                <button onclick="switchMainLibTab('penalties')" id="main-lib-tab-p" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-950 border border-slate-800 text-slate-400">🥃 Bảng hình phạt</button>
            </div>

            <div id="lib-view-questions" class="flex flex-col flex-1 overflow-hidden">
                <div class="flex gap-2 mb-4">
                    <button onclick="switchLibTab('easy')" id="lib-tab-easy" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-950 border border-slate-800 text-slate-400">🌱 Nhẹ nhàng</button>
                    <button onclick="switchLibTab('medium')" id="lib-tab-medium" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-purple-500/20 border border-purple-500 text-purple-300">🔥 Bàn nhậu</button>
                    <button onclick="switchLibTab('hard')" id="lib-tab-hard" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-950 border border-slate-800 text-slate-400">🌶️ Hardcore</button>
                </div>
                <div id="lib-content-area" class="overflow-y-auto flex-1 space-y-4 pr-1 text-xs"></div>
            </div>

            <div id="lib-view-penalties" class="flex flex-col flex-1 overflow-hidden hidden">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-xs text-slate-400">Danh sách hình phạt:</div>
                    <button onclick="openPenaltyModalForAdd()" class="bg-purple-600/20 text-purple-300 border border-purple-500/40 text-xs px-2.5 py-1 rounded-lg font-semibold hover:bg-purple-600/30">+ Thêm hình phạt</button>
                </div>
                <div id="penalty-content-area" class="overflow-y-auto flex-1 space-y-2 pr-1 text-xs"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: PENALTY RESULT -->
    <div id="penalty-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-gradient-to-br from-red-950/90 to-slate-900 border border-red-500/50 w-full max-w-sm p-6 rounded-2xl shadow-2xl text-center">
            <span class="text-xs uppercase tracking-widest text-red-400 font-extrabold">🚨 PHẠT BỎ CUỘC 🚨</span>
            <h3 id="penalty-result-text" class="text-2xl font-black text-white my-4">Đang quay...</h3>
            <button onclick="closePenaltyModal()" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl text-sm text-white">Đã phục tùng 🍻</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOCALSTORAGE PERSISTENCE -->
    <script>
        const DEFAULT_DATA = {
            questions: {
                easy: {
                    truth: [
                        "Kể tên một tật xấu kỳ cục nhất của bạn.",
                        "Món đồ kỳ lạ nhất bạn từng mua online là gì?",
                        "Ai là người trong phòng có ấn tượng ban đầu khó gần nhất?",
                        "Lần gần đây nhất bạn khóc vì lý do nhảm nhí là gì?"
                    ],
                    dare: [
                        "Gửi tin nhắn 'Mình nhớ bạn quá' cho người thứ 3 trong danh bạ.",
                        "Chụp một bức ảnh selfie dìm hàng rồi gửi vào nhóm chung.",
                        "Bắt chước giọng điệu một người trong bàn trong 30 giây.",
                        "Uống cạn một ly nước lọc theo phong cách hoa hậu."
                    ]
                },
                medium: {
                    truth: [
                        "Bạn đã từng có cảm nắng ai đang ngồi trong bàn này chưa?",
                        "Lần say xỉn đáng xấu hổ nhất của bạn diễn ra thế nào?",
                        "Nếu crush nhắn tin rủ đi chơi lúc 11h đêm, bạn phản ứng sao?",
                        "Kể tên món ăn thảm họa nhất bạn từng nấu."
                    ],
                    dare: [
                        "Uống 1 ly mix độc quyền do người đối diện pha chế.",
                        "Gọi điện cho một người bất kỳ, nói 'Tôi yêu bạn' rồi cúp máy.",
                        "Đóng vai nhân viên đa cấp rao bán cái ly trên bàn trong 1 phút.",
                        "Để người bên phải vẽ một hình lên tay bằng bút dạ."
                    ]
                },
                hard: {
                    truth: [
                        "Điểm hấp dẫn nhất và ghét nhất ở người yêu cũ là gì?",
                        "Điều điên rồ nhất bạn từng làm trong chuyện tình cảm là gì?",
                        "Nếu kẹt trên hoang đảo với 1 người trong phòng, bạn chọn ai?",
                        "Bí mật thầm kín nhất chưa từng kể cho ai nghe (Hoặc uống 2 ly)."
                    ],
                    dare: [
                        "Cho người bên phải xem lịch sử tìm kiếm Google gần nhất.",
                        "Nhắn tin cho người yêu cũ: 'Em/Anh nhớ kỷ niệm xưa quá'.",
                        "Đổi chỗ cho người bạn thấy nguy hiểm nhất và tuân lệnh họ 2 vòng.",
                        "Catwalk dọc phòng với một chiếc dép lê đặt trên đầu."
                    ]
                }
            },
            penalties: [
                { content: "🍻 Uống phạt 1 ly 100%!", source: "default" },
                { content: "🍻 Uống phạt 2 ngụm đầy tình cảm!", source: "default" },
                { content: "🥃 Phạt cạn ly đáy cốc!", source: "default" },
                { content: "👥 Chỉ định 1 người bất kỳ uống cùng 1 ly!", source: "default" },
                { content: "🎲 Phạt uống 2 ly liên tiếp không nghỉ!", source: "default" },
                { content: "🎯 Nhắm mắt uống cạn ly do người bên phải pha!", source: "default" },
                { content: "🔥 Vừa uống vừa hô to 'Tôi chịu phạt' 3 lần!", source: "default" }
            ]
        };

        let appData = DEFAULT_DATA;
        let players = [];
        let currentLevel = 'medium';
        let currentPlayerIndex = 0;
        let selectedModalType = 'truth';
        let selectedBulkType = 'truth';
        let currentLibTab = 'medium';
        let currentMainLibTab = 'questions';
        let currentCategoryMode = 'question';
        let currentPickedType = null;
        let toastTimer = null;

        // LocalStorage Read & Write
        function loadAppData() {
            try {
                const stored = localStorage.getItem('say_hay_thach_storage_v1');
                if (stored) {
                    appData = JSON.parse(stored);
                } else {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    saveAppData();
                }
            } catch(e) {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        }

        function saveAppData() {
            try {
                localStorage.setItem('say_hay_thach_storage_v1', JSON.stringify(appData));
            } catch(e) {
                console.error('LocalStorage write error', e);
            }
            // Optional sync to Vercel BE
            fetch('/api/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'sync', data: appData })
            }).catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAppData();
            updatePlayerCount();
        });

        function updatePlayerCount() {
            const val = document.getElementById('player-input').value.trim();
            const count = val ? val.split(',').map(p => p.trim()).filter(p => p.length > 0).length : 0;
            document.getElementById('player-count-badge').innerText = `${count} người`;
        }

        function showNotification(message, icon = "✨") {
            const toast = document.getElementById('header-toast');
            document.getElementById('toast-message').innerText = message;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('hidden'); toast.classList.add('flex');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('flex'); toast.classList.add('hidden'); }, 3000);
        }

        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.className = "level-btn border border-slate-700 bg-slate-900 py-2 rounded-xl text-xs font-semibold text-slate-300";
            });
            document.getElementById(`btn-${level}`).className = "level-btn border border-pink-500 bg-pink-500/10 text-pink-400 py-2 rounded-xl text-xs font-semibold";
        }

        function startGame() {
            const inputVal = document.getElementById('player-input').value.trim();
            if (!inputVal) { showNotification('Nhập tên người chơi!', '⚠️'); return; }
            players = inputVal.split(',').map(p => p.trim()).filter(p => p);
            if (players.length === 0) { showNotification('Danh sách người chơi không hợp lệ!', '⚠️'); return; }
            
            currentPlayerIndex = Math.floor(Math.random() * players.length);
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            document.getElementById('current-level-badge').innerText = {easy:'🌱 Nhẹ nhàng', medium:'🔥 Bàn nhậu', hard:'🌶️ Hardcore'}[currentLevel];
            updateTurnDisplay();
            showNotification('Bắt đầu nhậu!', '🍻');
        }

        function updateTurnDisplay() {
            document.getElementById('current-player-name').innerText = players[currentPlayerIndex];
            document.getElementById('question-card').classList.add('hidden');
            document.getElementById('choice-buttons').classList.remove('hidden');
            document.getElementById('next-turn-btn').classList.add('hidden');
        }

        function pickQuestion(type) {
            currentPickedType = type;
            const pool = appData.questions[currentLevel]?.[type] || [];
            if (pool.length === 0) {
                displayQuestionContent(type, "Chưa có câu hỏi nào trong danh mục này!");
                return;
            }
            const q = pool[Math.floor(Math.random() * pool.length)];
            displayQuestionContent(type, q);
        }

        function rerollQuestion() { if(currentPickedType) pickQuestion(currentPickedType); }

        function displayQuestionContent(type, text) {
            const tag = document.getElementById('q-type-tag');
            tag.innerText = type === 'truth' ? "💡 THẬT" : "🔥 THÁCH";
            tag.className = `text-xs uppercase font-extrabold px-3 py-1 rounded-full mb-3 ${type==='truth'?'bg-blue-500/20 text-blue-300 border border-blue-500/30':'bg-red-500/20 text-red-300 border border-red-500/30'}`;
            document.getElementById('q-content').innerText = text;
            document.getElementById('question-card').classList.remove('hidden');
            document.getElementById('choice-buttons').classList.add('hidden');
            document.getElementById('next-turn-btn').classList.remove('hidden');
        }

        function triggerPenalty() {
            const penalties = appData.penalties;
            const p = penalties.length ? penalties[Math.floor(Math.random() * penalties.length)].content : "🍻 Uống 100%!";
            document.getElementById('penalty-result-text').innerText = p;
            document.getElementById('penalty-modal').classList.remove('hidden');
            document.getElementById('penalty-modal').classList.add('flex');
        }

        function closePenaltyModal() {
            document.getElementById('penalty-modal').classList.remove('flex');
            document.getElementById('penalty-modal').classList.add('hidden');
        }

        function nextTurn() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateTurnDisplay();
        }

        function resetGame() {
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function openModal(editData = null) {
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
            if(editData) {
                if(editData.category === 'question') {
                    switchCategoryMode('question');
                    document.getElementById('modal-level').value = editData.level;
                    document.getElementById('modal-content').value = editData.content;
                    document.getElementById('edit-id').value = editData.index;
                    setModalType(editData.type);
                } else {
                    switchCategoryMode('penalty');
                    document.getElementById('penalty-modal-content').value = editData.content;
                    document.getElementById('edit-penalty-id').value = editData.index;
                }
            } else {
                switchCategoryMode('question');
                document.getElementById('edit-id').value = "";
                document.getElementById('edit-penalty-id').value = "";
                document.getElementById('modal-content').value = "";
                document.getElementById('penalty-modal-content').value = "";
            }
        }

        function openPenaltyModalForAdd() { openModal(); switchCategoryMode('penalty'); }
        function closeModal() { document.getElementById('custom-modal').classList.remove('flex'); document.getElementById('custom-modal').classList.add('hidden'); }

        function switchCategoryMode(mode) {
            currentCategoryMode = mode;
            document.getElementById('form-question-section').classList.toggle('hidden', mode !== 'question');
            document.getElementById('form-penalty-section').classList.toggle('hidden', mode !== 'penalty');
            document.getElementById('tab-cat-q').className = `flex-1 py-1.5 rounded-lg text-xs font-semibold ${mode==='question'?'bg-pink-500/20 border border-pink-500 text-pink-300':'bg-slate-950 border border-slate-800 text-slate-400'}`;
            document.getElementById('tab-cat-p').className = `flex-1 py-1.5 rounded-lg text-xs font-semibold ${mode==='penalty'?'bg-purple-500/20 border border-purple-500 text-purple-300':'bg-slate-950 border border-slate-800 text-slate-400'}`;
        }

        function switchAddMode(mode) {
            document.getElementById('form-single').classList.toggle('hidden', mode !== 'single');
            document.getElementById('form-bulk').classList.toggle('hidden', mode !== 'bulk');
        }

        function setModalType(type) {
            selectedModalType = type;
            document.getElementById('modal-type-truth').className = `modal-type-btn border ${type==='truth'?'border-blue-500 bg-blue-500/20 text-blue-300':'border-slate-700 bg-slate-950 text-slate-400'} py-2 rounded-xl text-xs font-semibold`;
            document.getElementById('modal-type-dare').className = `modal-type-btn border ${type==='dare'?'border-red-500 bg-red-500/20 text-red-300':'border-slate-700 bg-slate-950 text-slate-400'} py-2 rounded-xl text-xs font-semibold`;
        }

        function setBulkType(type) {
            selectedBulkType = type;
            document.getElementById('bulk-type-truth').className = `bulk-type-btn border ${type==='truth'?'border-blue-500 bg-blue-500/20 text-blue-300':'border-slate-700 bg-slate-950 text-slate-400'} py-2 rounded-xl text-xs font-semibold`;
            document.getElementById('bulk-type-dare').className = `bulk-type-btn border ${type==='dare'?'border-red-500 bg-red-500/20 text-red-300':'border-slate-700 bg-slate-950 text-slate-400'} py-2 rounded-xl text-xs font-semibold`;
        }

        function saveQuestion() {
            const content = document.getElementById('modal-content').value.trim();
            const level = document.getElementById('modal-level').value;
            const editId = document.getElementById('edit-id').value;
            if(!content) { showNotification('Chưa nhập nội dung!', '⚠️'); return; }

            if (!appData.questions[level]) appData.questions[level] = { truth: [], dare: [] };
            if (!appData.questions[level][selectedModalType]) appData.questions[level][selectedModalType] = [];

            if (editId !== "") {
                const idx = parseInt(editId);
                appData.questions[level][selectedModalType][idx] = content;
                showNotification('Đã sửa câu hỏi!', '✅');
            } else {
                appData.questions[level][selectedModalType].push(content);
                showNotification('Đã thêm câu hỏi vĩnh viễn vào máy!', '💾');
            }

            saveAppData();
            closeModal();
            openLibraryModal();
        }

        function saveBulkQuestions() {
            const rawText = document.getElementById('bulk-content').value.trim();
            const level = document.getElementById('bulk-level').value;
            if (!rawText) { showNotification('Chưa nhập danh sách câu hỏi!', '⚠️'); return; }
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) { showNotification('Không có câu hỏi hợp lệ!', '⚠️'); return; }

            if (!appData.questions[level]) appData.questions[level] = { truth: [], dare: [] };
            if (!appData.questions[level][selectedBulkType]) appData.questions[level][selectedBulkType] = [];

            appData.questions[level][selectedBulkType].push(...lines);
            saveAppData();

            showNotification(`Đã lưu vĩnh viễn ${lines.length} câu hỏi vào máy!`, '💾');
            closeModal();
            openLibraryModal();
        }

        function savePenalty() {
            const content = document.getElementById('penalty-modal-content').value.trim();
            const editId = document.getElementById('edit-penalty-id').value;
            if(!content) { showNotification('Chưa nhập hình phạt!', '⚠️'); return; }

            if (editId !== "") {
                const idx = parseInt(editId);
                appData.penalties[idx].content = content;
                showNotification('Đã sửa hình phạt!', '✅');
            } else {
                appData.penalties.push({ content, source: 'custom' });
                showNotification('Đã thêm hình phạt vĩnh viễn!', '💾');
            }

            saveAppData();
            closeModal();
            openLibraryModal();
            switchMainLibTab('penalties');
        }

        function deleteQuestion(level, type, index) {
            if(!confirm('Xóa câu hỏi này?')) return;
            appData.questions[level][type].splice(index, 1);
            saveAppData();
            renderLibraryContent(currentLibTab);
            showNotification('Đã xóa câu hỏi!', '🗑️');
        }

        function deletePenalty(index) {
            if(!confirm('Xóa hình phạt này?')) return;
            appData.penalties.splice(index, 1);
            saveAppData();
            renderPenaltyContent();
            showNotification('Đã xóa hình phạt!', '🗑️');
        }

        function openLibraryModal() {
            renderLibraryContent(currentLibTab);
            renderPenaltyContent();
            document.getElementById('library-modal').classList.remove('hidden');
            document.getElementById('library-modal').classList.add('flex');
        }

        function closeLibraryModal() {
            document.getElementById('library-modal').classList.remove('flex');
            document.getElementById('library-modal').classList.add('hidden');
        }

        function switchMainLibTab(tab) {
            currentMainLibTab = tab;
            document.getElementById('lib-view-questions').classList.toggle('hidden', tab !== 'questions');
            document.getElementById('lib-view-penalties').classList.toggle('hidden', tab !== 'penalties');
            document.getElementById('main-lib-tab-q').className = `flex-1 py-1.5 rounded-lg text-xs font-semibold ${tab==='questions'?'bg-purple-500/20 border border-purple-500 text-purple-300':'bg-slate-950 border border-slate-800 text-slate-400'}`;
            document.getElementById('main-lib-tab-p').className = `flex-1 py-1.5 rounded-lg text-xs font-semibold ${tab==='penalties'?'bg-purple-500/20 border border-purple-500 text-purple-300':'bg-slate-950 border border-slate-800 text-slate-400'}`;
        }

        function switchLibTab(level) {
            currentLibTab = level;
            ['easy', 'medium', 'hard'].forEach(l => {
                document.getElementById(`lib-tab-${l}`).className = `flex-1 py-1.5 rounded-lg text-xs font-semibold ${l===level?'bg-purple-500/20 border border-purple-500 text-purple-300':'bg-slate-950 border border-slate-800 text-slate-400'}`;
            });
            renderLibraryContent(level);
        }

        function renderLibraryContent(level) {
            const container = document.getElementById('lib-content-area');
            const qData = appData.questions[level] || { truth: [], dare: [] };
            let html = '<div class="mb-3"><h4 class="text-blue-400 font-bold mb-1 uppercase">💡 Thật (Truth)</h4><ul class="space-y-1.5">';
            qData.truth.forEach((q, idx) => {
                html += `<li class="text-slate-300 bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center gap-2">
                    <span class="flex-1">${idx + 1}. ${q}</span>
                    <div class="flex gap-1">
                        <button onclick="openModal({category:'question', level:'${level}', type:'truth', index:${idx}, content:\`${q.replace(/`/g, '\`')}\`})" class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded">Sửa</button>
                        <button onclick="deleteQuestion('${level}', 'truth', ${idx})" class="px-2 py-1 bg-red-500/20 text-red-300 rounded">Xóa</button>
                    </div>
                </li>`;
            });
            if(!qData.truth.length) html += '<li class="text-slate-500 italic">Trống.</li>';
            html += '</ul></div><div><h4 class="text-red-400 font-bold mb-1 uppercase">🔥 Thách (Dare)</h4><ul class="space-y-1.5">';
            qData.dare.forEach((q, idx) => {
                html += `<li class="text-slate-300 bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center gap-2">
                    <span class="flex-1">${idx + 1}. ${q}</span>
                    <div class="flex gap-1">
                        <button onclick="openModal({category:'question', level:'${level}', type:'dare', index:${idx}, content:\`${q.replace(/`/g, '\`')}\`})" class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded">Sửa</button>
                        <button onclick="deleteQuestion('${level}', 'dare', ${idx})" class="px-2 py-1 bg-red-500/20 text-red-300 rounded">Xóa</button>
                    </div>
                </li>`;
            });
            if(!qData.dare.length) html += '<li class="text-slate-500 italic">Trống.</li>';
            html += '</ul></div>';
            container.innerHTML = html;
        }

        function renderPenaltyContent() {
            const container = document.getElementById('penalty-content-area');
            const penalties = appData.penalties;
            let html = '<ul class="space-y-2">';
            penalties.forEach((p, idx) => {
                html += `<li class="text-red-200 bg-slate-950 p-2.5 rounded-xl border border-red-500/30 flex justify-between items-center gap-2">
                    <span class="flex-1">${idx + 1}. ${p.content}</span>
                    <div class="flex gap-1">
                        <button onclick="openModal({category:'penalty', index:${idx}, content:\`${p.content.replace(/`/g, '\`')}\`})" class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded">Sửa</button>
                        <button onclick="deletePenalty(${idx})" class="px-2 py-1 bg-red-500/20 text-red-300 rounded">Xóa</button>
                    </div>
                </li>`;
            });
            if(!penalties.length) html += '<li class="text-slate-500 italic">Trống.</li>';
            html += '</ul>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
